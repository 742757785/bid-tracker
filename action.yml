name: 抓取招标信息
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version: 20
      - run: npm init -y
      - run: npm install node-fetch@2 cheerio
      - run: node fetch-data.js
      - run: git config user.email action@github.com
      - run: git config user.name Action
      - run: git add data.json
      - run: "git commit -m update || true"
      - run: git push
